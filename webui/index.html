<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>可可喵的衣柜</title>
<style>
  :root {
    color-scheme: dark;
    --bg-card: #232833;
    --bg-input: #191d24;
    --line: #3a4150;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #f472b6;
    --accent-soft: #f9a8d4;
    --danger: #f87171;
  }
  body.maibot-page {
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    margin: 0; padding: 14px 16px 40px; color: var(--text); background: transparent;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: var(--accent-soft); font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  button { border: 1px solid var(--line); background: #333a47; color: #d1d5db;
           border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent-soft); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111827; font-weight: 600; }
  button.primary:hover { background: var(--accent-soft); color: #111827; }
  input, select { background: var(--bg-input); border: 1px solid var(--line); color: var(--text);
                  border-radius: 6px; padding: 3px 7px; font-size: 13px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .name { width: 130px; }
  .color { width: 72px; }
  .tags { width: 110px; }
  select.cat { max-width: 100px; }

  /* 今日穿搭条 */
  .today { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
           background: #2a1a26; border: 1px solid #665018; border-radius: 8px;
           padding: 8px 12px; font-size: 13px; margin-top: 10px; }
  .today .sub { flex: 1 }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { border: 1px solid var(--line); background: var(--bg-card); color: var(--muted);
          border-radius: 14px; padding: 3px 12px; font-size: 12px; cursor: pointer; user-select: none; }
  .chip b { color: var(--text); font-weight: 600; margin-left: 2px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #111827; }
  .chip.active b { color: #111827; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 8px;
          padding: 7px 10px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .card .id { font-size: 11px; color: var(--muted); }
  .card .nm { font-weight: 600; font-size: 13px; min-width: 56px; }
  .card .star { color: var(--accent-soft); font-size: 12px; border: 1px solid #665018;
                border-radius: 10px; padding: 0 7px; }
  .card .src { font-size: 11px; color: var(--muted); }
  .card label.ck { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
  .card .spacer { flex: 1; }
  .card button { padding: 2px 8px; }
  .seasons { display: inline-flex; gap: 3px; }
  .seasons label.ck { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; }

  .addbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            background: var(--bg-card); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; }
  .addbar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
  #msg { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
         background: #111827; color: #fff; border: 1px solid var(--line); border-radius: 8px;
         padding: 7px 16px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  #msg.show { opacity: .95; }
  #msg.err { background: #7f1d1d; }
</style>
</head>
<body class="maibot-page">
  <div class="toolbar">
    <div>
      <h1>👗 可可喵的衣柜 <span class="sub">手动维护衣服，保存后立即生效</span></h1>
    </div>
    <button id="refresh">刷新</button>
  </div>

  <div class="today" id="today"></div>
  <div class="chips" id="chips"></div>
  <div id="sections"></div>

  <h2>＋ 新增衣服</h2>
  <div class="addbar">
    <input class="name" id="add-name" placeholder="名字，如 樱粉针织开衫" maxlength="40">
    <select class="cat" id="add-cat"></select>
    <input class="color" id="add-color" placeholder="颜色" maxlength="20">
    <span class="seasons" id="add-seasons"></span>
    <input class="tags" id="add-tags" placeholder="标签，逗号分隔" maxlength="60">
    <label class="ck"><input type="checkbox" id="add-signature"> 标志★</label>
    <button class="primary" id="add-save">添加</button>
  </div>

  <div id="msg"></div>

<script type="module">
  const showFatal = (label, detail) => {
    const el = document.querySelector("#sections");
    if (el) el.innerHTML = `<div class="empty" style="color:#f87171">${label}: ${String(detail).replace(/[<>&]/g, "")}</div>`;
  };
  window.addEventListener("error", (ev) => showFatal("脚本错误", ev.message));
  window.addEventListener("unhandledrejection", (ev) => showFatal("启动失败", ev.reason && (ev.reason.message || ev.reason)));

  await maibot.ready;

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const SEASON_META = [["spring","春"],["summer","夏"],["autumn","秋"],["winter","冬"]];

  let STATE = null;
  let FILTER = "全部";

  function toast(text, ok = true) {
    const el = $("#msg");
    el.textContent = text;
    el.classList.toggle("err", !ok);
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }
  const fail = (e) => { toast((e && (e.message || e.error || String(e))) || "操作失败", false); console.error(e); };

  const seasonLabel = (seasons) => {
    if (!Array.isArray(seasons) || !seasons.length || seasons.includes("all")) return "四季";
    return SEASON_META.filter(([k]) => seasons.includes(k)).map(([, cn]) => cn).join("");
  };
  const readSeasonChecks = (box) => {
    const checked = SEASON_META.filter(([k]) => box.querySelector(`input[data-season="${k}"]`).checked).map(([k]) => k);
    return checked.length === 4 ? ["all"] : checked;
  };
  const seasonChecksHTML = (seasons) => {
    const has = (k) => !seasons || !seasons.length || seasons.includes("all") || seasons.includes(k);
    return `<span class="seasons">` + SEASON_META.map(([k, cn]) =>
      `<label class="ck"><input type="checkbox" data-season="${k}"${has(k) ? " checked" : ""}>${cn}</label>`).join("") + `</span>`;
  };

  function cardHTML(item) {
    return `<div class="card" data-id="${esc(item.id)}">
      <span class="id">${esc(item.id)}</span>
      <input class="name row-name" value="${esc(item.name)}" maxlength="40">
      <select class="cat row-cat">${STATE.categories.map((c) =>
        `<option value="${esc(c)}"${c === item.category ? " selected" : ""}>${esc(c)}</option>`).join("")}
      </select>
      <input class="color row-color" value="${esc(item.color || "")}" placeholder="颜色" maxlength="20">
      ${seasonChecksHTML(item.seasons)}
      <input class="tags row-tags" value="${esc((item.tags || []).join(","))}" placeholder="标签" maxlength="60">
      <label class="ck"><input type="checkbox" class="row-signature"${item.signature ? " checked" : ""}> 标志★</label>
      ${item.signature ? '<span class="star">标志</span>' : ""}
      ${item.source && item.source !== "初始衣柜" ? `<span class="src">${esc(item.source)}</span>` : ""}
      <span class="spacer"></span>
      <button class="row-save primary">存</button>
      <button class="danger row-del">删</button>
    </div>`;
  }

  function bindCard(card) {
    const id = card.dataset.id;
    card.querySelector(".row-save").onclick = async () => {
      const name = card.querySelector(".row-name").value.trim();
      if (!name) { toast("名字不能为空", false); return; }
      try {
        await maibot.action("set_item", {
          item_id: id, name,
          category: card.querySelector(".row-cat").value,
          seasons: readSeasonChecks(card),
          color: card.querySelector(".row-color").value.trim(),
          tags: card.querySelector(".row-tags").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
          signature: card.querySelector(".row-signature").checked,
        });
        toast(`已保存：${name}`);
        await refresh();
      } catch (e) { fail(e); }
    };
    card.querySelector(".row-del").onclick = async () => {
      try { await maibot.action("remove_item", { item_id: id }); toast("已移除"); await refresh(); }
      catch (e) { fail(e); }
    };
  }

  function renderChips(items) {
    const cats = ["全部", ...STATE.categories];
    const counts = {};
    for (const it of items) counts[it.category] = (counts[it.category] || 0) + 1;
    $("#chips").innerHTML = cats.map((c) => {
      const n = c === "全部" ? items.length : (counts[c] || 0);
      if (c !== "全部" && n === 0) return "";
      return `<span class="chip${FILTER === c ? " active" : ""}" data-cat="${esc(c)}">${esc(c)}<b>${n}</b></span>`;
    }).join("");
    $("#chips").querySelectorAll(".chip").forEach((el) => {
      el.onclick = () => { FILTER = el.dataset.cat; renderItems(); };
    });
  }

  function renderItems() {
    const items = STATE.items || [];
    renderChips(items);
    const box = $("#sections");
    if (!items.length) { box.innerHTML = '<div class="empty">衣柜空空如也，在下面添加衣服吧</div>'; return; }
    const byCat = {};
    for (const it of items) (byCat[it.category] || (byCat[it.category] = [])).push(it);
    const cats = FILTER === "全部"
      ? STATE.categories.filter((c) => (byCat[c] || []).length)
      : [FILTER];
    box.innerHTML = cats.map((c) =>
      `<h2>${esc(c)} <span class="sub">${byCat[c].length} 件</span></h2>
       <div class="grid">${byCat[c].map(cardHTML).join("")}</div>`
    ).join("");
    box.querySelectorAll(".card").forEach(bindCard);
  }

  function renderToday() {
    const box = $("#today");
    const t = STATE.today;
    const desire = Math.round((STATE.share_desire ?? 0) * 10) / 10;
    box.innerHTML = t
      ? `<span>今天（${esc(t.date)}）穿：</span><b>${esc(t.description)}</b><span class="sub">${esc(t.reason || "")}</span><span class="sub">分享欲 ${desire}/1.0</span>`
      : `<span class="sub">今天还没决定穿搭（到点后 keke 会自己挑） · 分享欲 ${desire}/1.0（在插件配置里调整）</span>`;
  }

  function renderAddBar() {
    $("#add-cat").innerHTML = STATE.categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    $("#add-seasons").innerHTML = seasonChecksHTML(["all"]);
  }

  async function refresh() {
    try {
      STATE = await maibot.query("state");
      if (FILTER !== "全部" && !STATE.categories.includes(FILTER)) FILTER = "全部";
      renderAddBar();
      renderToday();
      renderItems();
    } catch (e) { fail(e); }
  }

  $("#refresh").onclick = refresh;

  $("#add-save").onclick = async () => {
    const name = $("#add-name").value.trim();
    if (!name) { toast("请填写衣服名字", false); return; }
    try {
      await maibot.action("add_item", {
        name,
        category: $("#add-cat").value,
        seasons: readSeasonChecks($("#add-seasons")),
        color: $("#add-color").value.trim(),
        tags: $("#add-tags").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
        signature: $("#add-signature").checked,
      });
      toast(`已添加：${name}`);
      $("#add-name").value = ""; $("#add-color").value = ""; $("#add-tags").value = "";
      $("#add-signature").checked = false;
      FILTER = $("#add-cat").value;
      await refresh();
    } catch (e) { fail(e); }
  };

  await refresh();
</script>
</body>
</html>
