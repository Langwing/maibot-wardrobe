# ============================================================
# 衣柜插件 配置说明（麦麦的虚拟衣柜）
# 直接改本文件或网页后台改都行，保存后生效方式：
#   网页后台改=立即生效；改本文件=重启麦麦后生效
# ============================================================

# 插件总开关（true 开 / false 关）
enabled = true

# 白名单：能和衣柜玩法互动的 QQ 号（一行一个）。
# 和备忘录插件是两份独立名单，这里也要填！
# 留空 [ ] 时没人能玩衣柜，而且麦麦换了装也没地方"记起来"
whitelist = [
  # "10000",
]

# 黑名单：写在这里的人，即使在白名单里也不能用
blacklist = []

# ★★ 分享欲滑条（0.0 ~ 1.0），本插件的灵魂设置 ★★
#   每天到点换装时按这个概率掷骰：中了 →麦麦主动来找你晒今天的穿搭；
#   晒的时候再按同样的概率掷一次骰，中了 → 配一张绘图工具画的效果图。
#   1.0 = 每天必来晒、必带图    0.9 = 基本天天来
#   0.6 = 约六成的日子会来      0.2 = 十天来一两天
#   0.0 = 从不主动来，只有你问起ta才说今天穿了什么
share_desire = 0.6

# 每天几点决定当日穿搭，24 小时制 HH:MM。
# 改完保存即生效（网页后台改），不用重启
daily_outfit_time = "08:00"

# 查天气用的城市名（如 "杭州"）。
#麦麦换装时会用高德工具查这个城市的真实天气来决定穿什么。
# 留空 = 不查真实天气，只按季节估计
weather_city = ""

# 主动晒穿搭发给谁：
#   留空 [ ] = 发给上面白名单里每个人的私聊（默认）
#   想发别处就按格式写，可多个：
#     ["qq:private:10000"]              ← 发私聊
#     ["qq:group:123456789"]              ← 发某个群
#     ["qq:private:111", "qq:group:222"]  ← 私聊和群都发
share_to_streams = []

# 晒穿搭时允不允许用绘图工具画效果图（false = 永远纯文字描述）
image_enable = true

# 衣柜最多放多少件衣服（初始 54 件，逛街买新衣会慢慢变多）
max_items = 200

# 穿搭历史保留多少天（"昨天穿的什么"会用来避免连续两天穿同一套）
max_history = 30

# ------------------------------------------------------------
# 下面的 [items] 就是衣柜本体：每件衣服一个小表。
# 直接在网页后台（插件管理 → 衣柜 → 配置）里增删改最方便；
# 手动编辑时照着格式抄一条即可，编号（wXXX）别和已有重复
# ------------------------------------------------------------

[plugin]
# 系统用的配置版本号，别改
config_version = "1.0.0"

# 衣服清单表（首件衣服示例，正式使用由插件自动生成/网页后台维护）：
# [items.w001]
# name = "白色荷叶边衬衫"
# category = "上装"            # 上装/下装/连衣裙/外套/鞋子/袜子/配饰
# seasons = ["all"]            # spring/summer/autumn/winter/all，可多选
# color = "白"
# tags = ["标志", "女仆"]       # 风格标签，随便写
# signature = true             # 标志单品不能被扔掉
# source = "初始衣柜"           # 初始衣柜/主人送的/麦麦自己买的
# acquired_at = 0.0            # 不用管

[items]
